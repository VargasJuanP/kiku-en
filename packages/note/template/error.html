<template id="kikuen-error">
  <span>Failed to render card.</span>
  <span> <b>Error Name:</b> <span data-kikuen-error-name></span> </span>
  <span> <b>Error Message:</b> <span data-kikuen-error-message></span> </span>
  <span> <b>Error Cause:</b> <span data-kikuen-error-cause></span> </span>
  <span>
    <b>Error Stack:</b><br />
    <pre
      data-kikuen-error-stack
      style="
        white-space: pre-wrap;
        background: oklch(82% 0.189 84.429);
        color: oklch(41% 0.112 45.904);
        padding: 8px;
      "
    ></pre>
  </span>
  <br />
  <span>
    Make sure you have Anki updated to at least
    <a
      href="https://apps.ankiweb.net/"
      target="_blank"
      style="color: aqua; text-decoration: underline"
    >
      25.09
    </a>
  </span>
  <span>If you feel you messed up something, try to reinstall Kiku.</span>
</template>

<script>
  if (!window.renderErrorFallback) {
    window.renderErrorFallback = (error) => {
      sessionStorage.clear();
      Object.assign(document.body.style, {
        margin: 0,
        padding: 0,
        height: "100vh",
        width: "100vw",
        display: "flex",
        flexDirection: "column",
        justifyContent: "center",
        alignItems: "center",
        backgroundColor: "oklch(21.15% .012 254.09)",
        color: "oklch(71% .194 13.428)",
        textAlign: "center",
      });

      const errorTemplate = document.querySelector("#kikuen-error");
      if (!(errorTemplate instanceof HTMLTemplateElement)) return;

      const fragment = errorTemplate.content.cloneNode(true);
      if (error instanceof Error) {
        const setText = (selector, value) => {
          const el = fragment.querySelector(selector);
          if (el) el.textContent = value;
        };

        setText("[data-kikuen-error-name]", error.name);
        setText("[data-kikuen-error-message]", error.message);
        setText("[data-kikuen-error-cause]", String(error.cause ?? "N/A"));
        setText("[data-kikuen-error-stack]", error.stack ?? "");
      }

      document.body.replaceChildren(fragment);
    };

    window.addEventListener(
      "error",
      (event) => {
        if (!(event.target instanceof HTMLScriptElement)) return;
        if (event.target.id !== "kikuen-script") return;
        window.renderErrorFallback?.(
          new Error("Failed to load _kikuen.js. Did you delete Kiku files without reinstalling?"),
        );
      },
      true,
    );
  }
</script>
